name: Nightly Checks

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build the reactor (skip tests)
        run: ./mvnw -B -ntp -DskipTests install

      - name: Run PIT mutation testing
        run: ./mvnw -B -ntp -pl service/app org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report
          path: service/app/target/pit-reports
          if-no-files-found: warn
