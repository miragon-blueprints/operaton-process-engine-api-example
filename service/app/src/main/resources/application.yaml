server:
  port: 8080

spring:
  datasource:
    # Overridable via SPRING_DATASOURCE_* env vars for containerized/remote runs; the defaults target
    # the local dev Postgres (stack/docker-compose.yml). See CONTRIBUTING.md "Run it in containers".
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bikeleasing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the application schema (resources/db/migration); Hibernate only validates against it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    problemdetails:
      enabled: true

# process-engine-api (bpm-crafters): runs the operaton-embedded adapter, which polls external
# service tasks / user tasks on a schedule and hands them to the @ProcessEngineWorker beans and the
# UserTaskSupport subscription pool. Model deployment stays with Operaton (see operaton.bpm below,
# which also deploys the .form files), so the worker library's own deployment is disabled.
dev:
  bpm-crafters:
    process-api:
      worker:
        deployment:
          enabled: false
      adapter:
        operaton-embedded:
          enabled: true
          service-tasks:
            delivery-strategy: embedded_scheduled
            worker-id: leasing-worker
            schedule-delivery-fixed-rate-in-seconds: 1
          user-tasks:
            delivery-strategy: embedded_scheduled
            schedule-delivery-fixed-rate-in-seconds: 1

# A minimal, deploy/ops-ready surface. Everything else stays disabled.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Component detail is hidden. To expose it, set: show-details: always
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Keep the engine-internal /engine-rest API out of the generated contract; only expose /api/**.
  paths-to-match: /api/**

operaton:
  bpm:
    admin-user:
      id: admin
      password: admin
    # Deploy BPMN, DMN and Forms from the classpath so the .form files resolve in the Tasklist.
    deployment-resource-pattern:
      - classpath*:**/*.bpmn
      - classpath*:**/*.dmn
      - classpath*:**/*.form
    webapp:
      application-path: /operaton
    database:
      type: postgres
      schema-update: true
    # Poll async-continuation jobs quickly so the process advances promptly between wait states.
    job-execution:
      wait-time-in-millis: 250
      max-wait: 1000
