[versions]
spring_version = "4.1.1"
spring_dependency_version = "1.1.7"
kotlin_version = "2.4.10"
kotlin_logging_version = "3.0.5"
operaton_version = "2.1.4"
process_engine_api_version = "1.7"
process_engine_worker_version = "0.8.5"
process_engine_adapter_operaton_version = "2026.08.1"
springdoc_version = "3.1.1"   # 3.x = the Spring Boot 4 line; 3.1.0 is built against SB 4.1.0
bpmn_to_code_version = "5.2.0"
bpmn_to_code_testing_version = "5.2.0"
archunit_version = "1.5.0"
konsist_version = "0.17.3"

[libraries]
web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring_version" }
devtools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring_version" }
jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring_version" }
# The Spring Boot 4 module split no longer pulls plain JDBC transitively everywhere; the embedded engine
# needs a DataSource + transaction manager, so the JDBC starter is declared explicitly (see the Operaton
# adapter reference guide). data-jpa already brings it, but keeping it explicit documents the requirement.
jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "spring_version" }
postgres = { module = "org.postgresql:postgresql", version = "42.7.13" }
flyway = { module = "org.springframework.boot:spring-boot-starter-flyway", version.ref = "spring_version" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin_version" }
kotlin_logging = { module = "io.github.microutils:kotlin-logging", version.ref = "kotlin_logging_version" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# Operaton (Camunda 7 community fork) — engine BOM (aligns the transitive engine modules) plus the
# Spring Boot 4 webapp (Cockpit/Tasklist/Admin) and REST (`/engine-rest`) starters. The webapp starter
# transitively brings the embedded engine; the app runs on Jackson 3 with no Spin (only primitive
# process variables are stored), matching the adapter's `java-operaton-embedded-jackson3` example.
operaton-bom = { module = "org.operaton.bpm:operaton-only-bom", version.ref = "operaton_version" }
operaton-webapp = { module = "org.operaton.bpm.springboot:operaton-bpm-spring-boot-starter-webapp", version.ref = "operaton_version" }
operaton-rest = { module = "org.operaton.bpm.springboot:operaton-bpm-spring-boot-starter-rest", version.ref = "operaton_version" }

# process-engine-api (bpm-crafters) — the abstraction layer used to talk to the engine
# (start/correlate/complete via APIs, and @ProcessEngineWorker beans for the service tasks)
process-engine-api = { module = "dev.bpm-crafters.process-engine-api:process-engine-api", version.ref = "process_engine_api_version" }
process-engine-worker = { module = "dev.bpm-crafters.process-engine-worker:process-engine-worker-spring-boot-starter", version.ref = "process_engine_worker_version" }
process-engine-adapter-operaton-embedded = { module = "dev.bpm-crafters.process-engine-adapters:process-engine-adapter-operaton-embedded-spring-boot-starter", version.ref = "process_engine_adapter_operaton_version" }
process-engine-adapter-operaton-bom = { module = "dev.bpm-crafters.process-engine-adapters:process-engine-adapter-operaton-bom", version.ref = "process_engine_adapter_operaton_version" }

# OpenAPI — springdoc generates the contract served at /v3/api-docs and the Swagger UI
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc_version" }

# Observability — actuator probes (health/liveness/readiness, info, metrics) and a Prometheus registry
actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring_version" }
prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }   # version pinned by the Spring Boot BOM

# BPMN-to-code (generates the typed process API from the *.bpmn models; testing = model validation)
bpmn-to-code-runtime = { module = "io.miragon:bpmn-to-code-runtime", version.ref = "bpmn_to_code_version" }
bpmn-to-code-testing = { module = "io.miragon:bpmn-to-code-testing", version.ref = "bpmn_to_code_testing_version" }

# Architecture tests
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit_version" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist_version" }

# Testing
spring_test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring_version" }
spring_web_test = { module = "org.springframework.boot:spring-boot-webmvc-test", version.ref = "spring_version" }
spring_data_jpa_test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test", version.ref = "spring_version" }
mockito = { module = "org.mockito:mockito-inline", version = "5.2.0" }
kotlin_mockito = { module = "org.mockito.kotlin:mockito-kotlin", version = "6.3.0" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
spring_mockk = { module = "com.ninja-squad:springmockk", version = "5.0.1" }
h2 = { module = "com.h2database:h2", version = "2.5.250" }

# Process test — Operaton (BPMN-assert + JUnit5 test support; versions aligned by operaton-bom)
operaton-bpm-assert = { module = "org.operaton.bpm:operaton-bpm-assert", version.ref = "operaton_version" }
operaton-bpm-junit5 = { module = "org.operaton.bpm:operaton-bpm-junit5", version.ref = "operaton_version" }

[bundles]
defaultService = ["kotlin-reflect", "kotlin_logging", "jackson-kotlin", "devtools", "web", "actuator", "prometheus"]
database = ["jpa", "postgres", "flyway", "flyway-postgres"]
operaton = ["operaton-webapp", "operaton-rest", "jdbc"]
processEngineApi = ["process-engine-api", "process-engine-adapter-operaton-embedded", "process-engine-worker"]
test = ["spring_test", "spring_web_test", "spring_data_jpa_test", "mockito", "mockk", "spring_mockk", "kotlin_mockito"]
archunit = ["archunit"]
konsist = ["konsist"]
operatonProcessTest = ["operaton-bpm-assert", "operaton-bpm-junit5", "h2"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin_version" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin_version" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin_version" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin_version" }
springframework = { id = "org.springframework.boot", version.ref = "spring_version" }
spring-dependency = { id = "io.spring.dependency-management", version.ref = "spring_dependency_version" }
bpmnToCode = { id = "io.miragon.bpmn-to-code-gradle", version.ref = "bpmn_to_code_version" }
pitest = { id = "info.solidsoft.pitest", version = "1.19.0" }
